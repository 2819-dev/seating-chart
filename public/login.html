<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seating Planner · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3a5f'/%3E%3Crect x='9' y='12' width='14' height='8' rx='1.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='12' cy='7' r='2.2' fill='white'/%3E%3Ccircle cx='20' cy='7' r='2.2' fill='white'/%3E%3Ccircle cx='12' cy='25' r='2.2' fill='white'/%3E%3Ccircle cx='20' cy='25' r='2.2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9ecf1; color: #16202c; -webkit-font-smoothing: antialiased; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 14px; padding: 32px 28px 28px; box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 16px 40px rgba(16,24,40,.12); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-bottom: 22px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 20px; color: #7a8594; font-size: 13.5px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: #44505e; margin-bottom: 6px; }
  input { width: 100%; height: 42px; border: 1px solid #d3d9e1; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; outline: none; }
  input:focus { border-color: #2f6fb3; box-shadow: 0 0 0 3px rgba(47,111,179,.15); }
  button { margin-top: 16px; width: 100%; height: 42px; border: 0; border-radius: 8px; background: #1f3a5f; color: #fff; font: inherit; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  button:hover { background: #274a78; }
  .err { margin: 0 0 14px; padding: 9px 12px; background: #fdf0ef; color: #b4372f; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f3a5f"/><rect x="9" y="12" width="14" height="8" rx="1.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="7" r="2.2" fill="#fff"/><circle cx="20" cy="7" r="2.2" fill="#fff"/><circle cx="12" cy="25" r="2.2" fill="#fff"/><circle cx="20" cy="25" r="2.2" fill="#fff"/></svg>
      Seating Planner
    </div>
    <h1>Sign in</h1>
    <p class="sub">Enter the password to open your seating charts.</p>
    <!--ERR-->
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
